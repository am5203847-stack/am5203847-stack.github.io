<!DOCTYPE html>
<html dir="rtl" lang="ar"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SBG V32</title><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>body{background:#000;color:#fff;font-family:system-ui;padding:8px}.card{border:2px solid #d4af37;border-radius:14px;padding:12px;margin:10px 0;background:#111}.tab{padding:10px 18px;margin:3px;border-radius:20px;border:1px solid #d4af37;display:inline-block}.tab.active{background:#d4af37;color:#000}.item{background:#1a1a1a;padding:10px;margin:6px 0;border-radius:10px;border-right:4px solid #d4af37;display:flex;justify-content:space-between}.item.ok{border-right-color:#00ff88}.gold{background:#d4af37;color:#000;width:100%;padding:14px;border-radius:12px;border:none;font-weight:bold}.cam{background:#222;color:#ffd700;border:1px solid #ffd700;padding:6px 10px;border-radius:8px}.thumb{width:50px;height:50px;border-radius:6px}</style></head>
<body><div class="card" style="text-align:center"><h2 style="color:#ffd700">SBG-HSE V3.2 EN FIXED</h2><p>Rakaez A-4 | 415.8m2 | عيون 44</p><span class="tab active" id="tD" onclick="show('daily')">يومي 29</span><span class="tab" id="tW" onclick="show('weekly')">اسبوعي 50H</span><p id="prog" style="color:#ffd700"></p></div>
<div class="card"><div id="dailyList"></div><div id="weeklyList" style="display:none"></div><button class="gold" onclick="exportPDF()">📄 تصدير PDF انجليزي رسمي</button><button style="background:#d00000;color:#fff;width:100%;padding:10px;border-radius:10px;border:none;margin-top:6px" onclick="localStorage.clear();location.reload()">مسح</button></div>
<script>
const AR=["زيت المحرك","مياه الرادياتير","زيت الهيدروليك","زيت الفرامل","الاطارات","الشوكات","الفرامل","الكلاكس","حزام الامان","المرايات","تسريب زيوت","البطارية","طفاية الحريق","مثلث تحذير","لوحة التحكم","الدركسيون","السقف OHG","الشاسية","ازرار التحكم","الفرشة","بوق الرجوع","الاضاءة الدوارة","النظافة","تصريح التشغيل","رخصة السائق","ممنوع التدخين","منطقة العمل","الحمولة","توقيع السلامة"];
const EN=["Engine Oil","Radiator Water","Hydraulic Oil","Brake Oil","Tires","Forks & Chains","Brakes","Horn & Lights","Seat Belt","Mirrors","Oil Leaks","Battery","Fire Ext","Warning Triangle","Control Panel","Steering","OHG Roof","Chassis","Buttons","Mattress","Buzzer","Rotating Light","Cleanliness","Permit","License","No Smoking","Work Area","Load","Signature"];
const WAR=["زيت المحرك","فلتر الزيت","فلتر الهواء","فلتر هيدروليك","تشحيم 50 نقطة","شد السيور","بطارية","كهرباء","سلاسل","خراطيم هيدروليك","اسطوانات رفع","فرامل"];const WEN=["Oil Change","Oil Filter","Air Filter","Hydraulic Filter","Greasing 50pts","Belts","Battery Check","Electric","Chains","Hoses","Cylinders","Brakes"];
let cur='daily';function show(t){cur=t;document.getElementById('dailyList').style.display=t=='daily'?'block':'none';document.getElementById('weeklyList').style.display=t=='weekly'?'block':'none';document.getElementById('tD').className=t=='daily'?'tab active':'tab';document.getElementById('tW').className=t=='weekly'?'tab active':'tab';upd();}
function render(A,p,div){let d=document.getElementById(div);d.innerHTML='';A.forEach((txt,i)=>{let k=p+i;let chk=localStorage.getItem(k)=='1';let img=localStorage.getItem(k+'_img');d.innerHTML+=`<div class="item ${chk?'ok':''}"><span>${i+1}- ${txt}</span><div><input type="checkbox" ${chk?'checked':''} onchange="localStorage.setItem('${k}',this.checked?1:0);location.reload()" style="width:22px;height:22px"><button class="cam" onclick="openCam('${k}')">📸</button></div>${img?`<br><img src="${img}" class="thumb">`:''}</div>`;});}
function openCam(k){let inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.capture='environment';inp.onchange=e=>{let r=new FileReader();r.onload=()=>{localStorage.setItem(k+'_img',r.result);location.reload();};r.readAsDataURL(e.target.files[0]);};inp.click();}
function upd(){let total=cur=='daily'?29:WAR.length;let pre=cur=='daily'?'D':'W';let c=0;for(let i=0;i<total;i++)if(localStorage.getItem(pre+i)=='1')c++;document.getElementById('prog').innerText=`${cur}: ${c}/${total} - ${Math.round(c/total*100)}%`;}
render(AR,'D','dailyList');render(WAR,'W','weeklyList');upd();
async function exportPDF(){const {jsPDF}=window.jspdf;const doc=new jsPDF();let now=new Date();let ds=now.toISOString().split('T')[0]+' '+now.toLocaleTimeString();doc.setFontSize(14);doc.text('SBG - Rakaez A-4 - HSE OFFICIAL REPORT',10,15);doc.setFontSize(9);doc.text(`Date: ${ds}`,10,22);doc.text(`Project: Rakaez A-4 415.8m2 | Location: Oyoun 44 | Owner: Adel Mahmoud | ID: SBG2026adel89 | V3.2 EN`,10,28);let y=36;doc.text('DAILY 29 Points:',10,y);y+=6;for(let i=0;i<29;i++){let s=localStorage.getItem('D'+i)=='1'?'PASS':'FAIL';let ph=localStorage.getItem('D'+i+'_img')?' +PHOTO':'';doc.text(`${i+1}. ${EN[i]} : ${s}${ph}`,10,y);y+=5;if(y>285){doc.addPage();y=10;}}y+=4;doc.text('WEEKLY 50H:',10,y);y+=6;for(let i=0;i<WEN.length;i++){let s=localStorage.getItem('W'+i)=='1'?'PASS':'FAIL';doc.text(`${i+1}. ${WEN[i]} : ${s}`,10,y);y+=5;if(y>285){doc.addPage();y=10;}}y+=8;doc.text('Signature: SBG2026adel89 - Adel Mahmoud - First HSE Mobile in Egypt - 2026',10,y);doc.save(`SBG-HSE-EN-${Date.now()}.pdf`);}
</script></body></html>
