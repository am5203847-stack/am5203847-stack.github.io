<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SBG Rakaez V10 FINAL</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
body{background:#000;color:#fff;font-family:Arial;text-align:center;padding:10px}
h1{color:#FFD700}
.box{border:2px solid #FFD700;border-radius:15px;padding:10px;margin:10px auto;max-width:500px;background:#111}
.item{display:flex;justify-content:space-between;align-items:center;background:#222;padding:12px;margin:8px auto;max-width:500px;border-radius:10px}
.item.done{background:#003300;border:1px solid #00ff00}
.btn{background:#FFD700;color:#000;border:none;padding:10px 18px;border-radius:8px;font-weight:bold}
.btn-green{background:#00ff88;color:#000;width:90%;max-width:500px;padding:16px;font-size:18px;border:none;border-radius:12px;font-weight:bold;margin:15px}
input,textarea{width:90%;max-width:500px;padding:10px;margin:5px;border-radius:8px;background:#111;color:#fff;border:1px solid #555}
#sig{border:2px dashed #FFD700;background:#fff;width:90%;max-width:500px;height:150px;border-radius:10px}
</style>
</head>
<body>
<h1>SBG | Rakaez A-4/h</h1>
<div id="count" style="font-size:20px;margin:10px">ELEC: 0/20</div>
<div class="box">V10 FINAL - Online ✅</div>
<div id="list"></div>
<input id="engName" placeholder="Engineer Name">
<textarea id="notes" placeholder="Notes"></textarea>
<p>Signature:</p>
<canvas id="sig"></canvas><br>
<button onclick="clearSig()">Clear Signature</button><br>
<button class="btn-green" onclick="genPDF()">📄 Generate PDF V10</button>
<script>
const items=["Main Panel","Breakers","Wiring","Sockets","Lighting","Earth","DB Dressing","Cable Trays","Emergency Light","Fire Alarm","AC Points","Heater Points","Isolators","Control Wiring","Testing","Labeling","Earthing Pit","Lightning","Safety","Handover"];
let checked=Array(20).fill(false);
const list=document.getElementById('list');
function render(){list.innerHTML='';let c=0;items.forEach((n,i)=>{if(checked[i])c++;let d=document.createElement('div');d.className='item'+(checked[i]?' done':'');d.innerHTML=`<button class=btn onclick=toggle(${i})>${checked[i]?'✅':'Check'}</button><span>${i+1}. ${n}</span>`;list.appendChild(d)});document.getElementById('count').innerText=`ELEC: ${c}/20 - ${Math.round(c/20*100)}%`}
function toggle(i){checked[i]=!checked[i];render();localStorage.setItem('v10',JSON.stringify(checked))}
function load(){let s=localStorage.getItem('v10');if(s)checked=JSON.parse(s)}load();render();
const canvas=document.getElementById('sig');const ctx=canvas.getContext('2d');let dr=false;
function pos(e){const r=canvas.getBoundingClientRect();return{x:(e.touches?e.touches[0].clientX:e.clientX)-r.left,y:(e.touches?e.touches[0].clientY:e.clientY)-r.top}}
canvas.addEventListener('mousedown',e=>{dr=true;let p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y)});canvas.addEventListener('mousemove',e=>{if(!dr)return;let p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke()});canvas.addEventListener('mouseup',()=>dr=false);
canvas.addEventListener('touchstart',e=>{dr=true;let p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y)});canvas.addEventListener('touchmove',e=>{if(!dr)return;e.preventDefault();let p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke()},{passive:false});canvas.addEventListener('touchend',()=>dr=false);
function clearSig(){ctx.clearRect(0,0,canvas.width,canvas.height)}
async function genPDF(){const{jsPDF}=window.jspdf;const doc=new jsPDF();doc.setFontSize(14);doc.text("SBG - Rakaez A-4/h - V10 FINAL",10,15);let cnt=checked.filter(x=>x).length;doc.setFontSize(11);doc.text(`Date: ${new Date().toLocaleDateString('en-GB')} Time: ${new Date().toLocaleTimeString()}`,10,23);doc.text(`Progress: ${cnt}/20`,10,30);doc.text(`Engineer: ${document.getElementById('engName').value}`,10,37);let y=48;items.forEach((n,i)=>{let m=checked[i]?'[X]':'[ ]';doc.text(`${m} ${i+1}. ${n}`,10,y);y+=8;if(y>280){doc.addPage();y=15}});let notes=document.getElementById('notes').value;if(notes){doc.text("Notes: "+notes,10,y);y+=10}try{let s=canvas.toDataURL("image/png");doc.text("Signature:",10,y);y+=5;doc.addImage(s,'PNG',10,y,50,20)}catch(e){}doc.save(`SBG_V10_${cnt}_20.pdf`)}
</script>
</body>
</html>
