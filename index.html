<!DOCTYPE html>
<html dir="rtl" lang="ar"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SBG HSE V5 APP</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#d4af37"><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>body{background:#000;color:#fff;font-family:system-ui;padding:8px}.card{border:2px solid #d4af37;border-radius:14px;padding:12px;margin:10px 0;background:#111}.tab{padding:10px 18px;margin:3px;border-radius:20px;border:1px solid #d4af37;display:inline-block}.tab.active{background:#d4af37;color:#000}.item{background:#1a1a1a;padding:10px;margin:6px 0;border-radius:10px;border-right:4px solid #d4af37;display:flex;justify-content:space-between}.item.ok{border-right-color:#00ff88}.gold{background:linear-gradient(#d4af37,#ffd700);color:#000;width:100%;padding:14px;border-radius:12px;border:none;font-weight:bold;margin:6px 0}.cam{background:#222;color:#ffd700;border:1px solid #ffd700;padding:6px 10px;border-radius:8px}.thumb{width:50px;height:50px;border-radius:6px}#sig{border:2px dashed #d4af37;width:100%;height:150px;border-radius:10px;background:#fff;touch-action:none}#qrcode{width:128px;height:128px;margin:10px auto;background:#fff;padding:5px}.install{background:#00ff88;color:#000;padding:12px;width:100%;border-radius:12px;border:none;font-weight:bold;display:none}</style></head>
<body><div class="card" style="text-align:center"><h2 style="color:#ffd700">SBG-HSE V5 تطبيق</h2><p>Rakaez A-4 | 415.8m2 | يشتغل بدون نت</p><span class="tab active" id="tD" onclick="show('daily')">يومي 29</span><span class="tab" id="tW" onclick="show('weekly')">اسبوعي 50H</span><p id="prog" style="color:#ffd700"></p><button id="btnInstall" class="install" onclick="installApp()">📲 نزّل التطبيق على الفون</button></div>
<div class="card"><div id="dailyList"></div><div id="weeklyList" style="display:none"></div>
<div class="card"><p style="color:#ffd700">✍️ توقيعك:</p><canvas id="sig"></canvas><button onclick="clearSig()" style="background:#555;color:#fff;padding:6px 12px;border-radius:8px;border:none;margin-top:5px">مسح</button></div>
<div class="card" style="text-align:center"><div id="qrcode"></div><p id="qrtext" style="font-size:10px;color:#aaa"></p></div>
<button class="gold" onclick="exportPDF()">📄 تصدير PDF رسمي</button><button style="background:#d00000;color:#fff;width:100%;padding:10px;border-radius:10px;border:none;margin-top:6px" onclick="localStorage.clear();location.reload()">مسح</button></div>
<script>
let deferredPrompt;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;document.getElementById('btnInstall').style.display='block';});function installApp(){if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.then(r=>{if(r.outcome==='accepted')document.getElementById('btnInstall').style.display='none';deferredPrompt=null;});}}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').then(()=>console.log('SW OK'));}
const AR=["زيت المحرك","مياه الرادياتير","زيت الهيدروليك","زيت الفرامل","الاطارات","الشوكات","الفرامل","الكلاكس","حزام الامان","المرايات","تسريب زيوت","البطارية","طفاية الحريق","مثلث تحذير","لوحة التحكم","الدركسيون","السقف OHG","الشاسية","ازرار التحكم","الفرشة","بوق الرجوع","الاضاءة الدوارة","النظافة","تصريح التشغيل","رخصة السائق","ممنوع التدخين","منطقة العمل","الحمولة","توقيع السلامة"];
const EN=["Engine Oil","Radiator Water","Hydraulic Oil","Brake Oil","Tires","Forks & Chains","Brakes","Horn & Lights","Seat Belt","Glass & Mirrors","Oil Leaks","Battery","Fire Extinguisher","Warning Triangle","Control Panel","Steering","OHG Roof","Chassis","Control Buttons","Mattress","Reverse Buzzer","Rotating Light","General Cleanliness","Operation Permit","Driver License","No Smoking Zone","Work Area","Load","Safety Signature"];
const WAR=["زيت المحرك","فلتر الزيت","فلتر الهواء","فلتر هيدروليك","تشحيم 50 نقطة","شد السيور","بطارية","كهرباء","سلاسل","خراطيم هيدروليك","اسطوانات رفع","فرامل"];const WEN=["Oil Change","Oil Filter","Air Filter","Hydraulic Filter","Greasing 50pts","Belts","Battery Check","Electric","Chains","Hoses","Cylinders","Brakes"];
let cur='daily';function show(t){cur=t;document.getElementById('dailyList').style.display=t=='daily'?'block':'none';document.getElementById('weeklyList').style.display=t=='weekly'?'block':'none';document.getElementById('tD').className=t=='daily'?'tab active':'tab';document.getElementById('tW').className=t=='weekly'?'tab active':'tab';upd();}
function render(A,p,div){let d=document.getElementById(div);d.innerHTML='';A.forEach((txt,i)=>{let k=p+i;let chk=localStorage.getItem(k)=='1';let img=localStorage.getItem(k+'_img');d.innerHTML+=`<div class="item ${chk?'ok':''}"><span>${i+1}- ${txt}</span><div><input type="checkbox" ${chk?'checked':''} onchange="localStorage.setItem('${k}',this.checked?1:0);location.reload()" style="width:22px;height:22px"><button class="cam" onclick="openCam('${k}')">📸</button></div>${img?`<br><img src="${img}" class="thumb">`:''}</div>`;});}
function openCam(k){let inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.capture='environment';inp.onchange=e=>{let r=new FileReader();r.onload=()=>{localStorage.setItem(k+'_img',r.result);location.reload();};r.readAsDataURL(e.target.files[0]);};inp.click();}
function upd(){let total=cur=='daily'?29:WAR.length;let pre=cur=='daily'?'D':'W';let c=0;for(let i=0;i<total;i++)if(localStorage.getItem(pre+i)=='1')c++;document.getElementById('prog').innerText=`${cur}: ${c}/${total} - ${Math.round(c/total*100)}%`;genQR();}
const canvas=document.getElementById('sig');const ctx=canvas.getContext('2d');let drawing=false;function resize(){canvas.width=canvas.offsetWidth;canvas.height=150;let d=localStorage.getItem('SIG');if(d){let img=new Image();img.onload=()=>ctx.drawImage(img,0,0);img.src=d;}}setTimeout(resize,300);canvas.addEventListener('touchstart',e=>{drawing=true;ctx.beginPath();ctx.moveTo(e.touches[0].clientX-canvas.getBoundingClientRect().left,e.touches[0].clientY-canvas.getBoundingClientRect().top);e.preventDefault();});canvas.addEventListener('touchmove',e=>{if(!drawing)return;ctx.lineTo(e.touches[0].clientX-canvas.getBoundingClientRect().left,e.touches[0].clientY-canvas.getBoundingClientRect().top);ctx.stroke();e.preventDefault();});canvas.addEventListener('touchend',()=>{drawing=false;localStorage.setItem('SIG',canvas.toDataURL());});canvas.addEventListener('mousedown',e=>{drawing=true;ctx.beginPath();ctx.moveTo(e.offsetX,e.offsetY);});canvas.addEventListener('mousemove',e=>{if(!drawing)return;ctx.lineTo(e.offsetX,e.offsetY);ctx.stroke();});canvas.addEventListener('mouseup',()=>{drawing=false;localStorage.setItem('SIG',canvas.toDataURL());});function clearSig(){ctx.clearRect(0,0,canvas.width,canvas.height);localStorage.removeItem('SIG');}
function genQR(){let now=new Date();let c=0;for(let i=0;i<29;i++)if(localStorage.getItem('D'+i)=='1')c++;let txt=`SBG-RakaezA4 | ${now.toISOString().split('T')[0]} | Adel | ${c}/29 PASS | SBG2026adel89 | V5 APP`;document.getElementById('qrtext').innerText=txt;document.getElementById('qrcode').innerHTML='';new QRCode(document.getElementById('qrcode'),{text:txt,width:128,height:128});}
render(AR,'D','dailyList');render(WAR,'W','weeklyList');upd();
async function exportPDF(){const {jsPDF}=window.jspdf;const doc=new jsPDF();let now=new Date();let ds=now.toISOString().split('T')[0]+' '+now.toLocaleTimeString();doc.setFontSize(14);doc.text('SBG - Rakaez A-4 - HSE OFFICIAL REPORT V5 APP',10,15);doc.setFontSize(9);doc.text(`Date: ${ds} | OFFLINE APP`,10,22);doc.text(`Project: Rakaez A-4 415.8m2 | Oyoun 44 | Owner: Adel Mahmoud | ID: SBG2026adel89`,10,28);let y=36;doc.text('DAILY 29 Points:',10,y);y+=6;for(let i=0;i<29;i++){let s=localStorage.getItem('D'+i)=='1'?'PASS':'FAIL';let ph=localStorage.getItem('D'+i+'_img')?' +PHOTO':'';doc.text(`${i+1}. ${EN[i]} : ${s}${ph}`,10,y);y+=5;if(y>270){doc.addPage();y=10;}}y+=4;doc.text('WEEKLY 50H:',10,y);y+=6;for(let i=0;i<WEN.length;i++){let s=localStorage.getItem('W'+i)=='1'?'PASS':'FAIL';doc.text(`${i+1}. ${WEN[i]} : ${s}`,10,y);y+=5;if(y>270){doc.addPage();y=10;}}y+=8;doc.text('Signature:',10,y);let sig=localStorage.getItem('SIG');if(sig){try{doc.addImage(sig,'PNG',30,y+2,60,20);}catch(e){}}y+=25;doc.text('QR Verified | OFFLINE APP | First HSE Mobile in Egypt | 2026 | SBG GOLD',10,y);doc.save(`SBG-HSE-V5-APP-${Date.now()}.pdf`);}
</script></body></html>
