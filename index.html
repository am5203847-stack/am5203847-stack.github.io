elec:{t:'فحص الكهرباء واللوحات - 20 بند', ar:["لوحة كهرباء مقفولة ومؤمنة","قاطع تسريب أرضي ELCB/GFCI يعمل","التأريض Earth سليم","الأسلاك بدون تعري أو تلف","التوصيلات داخل علب مقفلة","لافتات تحذير جهد عالي","طفاية CO2 موجودة","عدم تحميل زائد على المقابس","المعدات معزولة","PPE كهربائي قفازات ونظارة","تصريح عمل كهرباء","قفل وتأمين LOTO مطبق","الإضاءة الطوارئ تعمل","مسافات آمنة من الماء","صيانة دورية مسجلة","فني كهرباء مرخص","مخارج الطوارئ واضحة","سلم عازل عند العمل علويا","فحص الأدوات الكهربائية Portable Tools","توقيع مسؤول الكهرباء"], en:["Panel Locked","ELCB/GFCI Working","Earthing OK","No Exposed Wires","Connections in Boxes","High Voltage Signs","CO2 Extinguisher","No Overload","Equipment Insulated","Electrical PPE","Electrical Permit","LOTO Applied","Emergency Light","Safe Distance from Water","Maintenance Log","Licensed Electrician","Emergency Exits","Insulated Ladder","Portable Tools Checked","Signature"]},
ptw:{t:'نظام تصاريح العمل PTW', ar:["نوع التصريح: حار/بارد/ارتفاع/حفر","وصف العمل بالتفصيل","الموقع والمساحة","مدة التصريح من - إلى","المخاطر محددة Risk Assessment","JSA / Method Statement مرفق","عزل الطاقة LOTO","فحص الغازات Gas Test","تهوية المكان","مراقب حريق Fire Watch","وسائل اطفاء","تصريح دخول مكان مغلق Confined","حزام أمان ونقطة تثبيت","تصريح حفر وخرائط خدمات","اغلاق المنطقة بشريط","تواصل طوارئ","أسماء العمال وتوقيعاتهم","المشرف مسؤول","توقيع السلامة","توقيع مدير المشروع","اغلاق التصريح بعد الانتهاء"], en:["PTW Type Hot/Cold/Height/Excavation","Work Description","Location","Duration","Risk Assessment","JSA Attached","LOTO","Gas Test","Ventilation","Fire Watch","Extinguishers","Confined Space Entry","Harness & Anchor","Excavation Permit & Utilities","Barrication","Emergency Comm","Workers Names & Sign","Supervisor","Safety Signature","PM Signature","PTW Closure"]},

let curEq=localStorage.getItem('CUR_EQ')||'forklift';
function saveC(){localStorage.setItem('COMP',document.getElementById('c1').value);localStorage.setItem('PROJ',document.getElementById('c2').value);localStorage.setItem('AREA',document.getElementById('c3').value);localStorage.setItem('ZONE',document.getElementById('c4').value);upd();alert('تم حفظ بيانات الشركة');}
function upd(){let c=localStorage.getItem('COMP')||'شركة النخبة';let p=localStorage.getItem('PROJ')||'Rakaez A-4';document.getElementById('compD').innerText=c+' | '+p+' | '+(localStorage.getItem('AREA')||'');document.getElementById('c1').value=localStorage.getItem('COMP')||'';document.getElementById('c2').value=localStorage.getItem('PROJ')||'';document.getElementById('c3').value=localStorage.getItem('AREA')||'';document.getElementById('c4').value=localStorage.getItem('ZONE')||'';render();}
function switchEq(eq){curEq=eq;localStorage.setItem('CUR_EQ',eq);document.querySelectorAll('.topBar button').forEach(b=>b.classList.remove('active'));document.getElementById('btn_'+eq).classList.add('active');render();}
function render(){let data=DB[curEq];document.getElementById('eqTitle').innerText=data.t;let d=document.getElementById('list');d.innerHTML='';data.ar.forEach((txt,i)=>{let k='EQ_'+curEq+'_'+i;let chk=localStorage.getItem(k)=='1';let img=localStorage.getItem(k+'_img');d.innerHTML+=`<div class="item" style="${chk?'border-right-color:#00ff88':''}"><span>${i+1}- ${txt}</span><div><input type="checkbox" ${chk?'checked':''} onchange="localStorage.setItem('${k}',this.checked?1:0);upd()" style="width:22px"><button onclick="cam('${k}')" style="background:#222;color:#ffd700;border:1px solid #ffd700;padding:4px 8px;border-radius:6px;margin-right:4px">📸</button></div>${img?`<br><img src="${img}" style="width:45px;height:45px;border-radius:6px;border:1px solid #d4af37">`:''}</div>`;});let total=data.ar.length;let done=0;for(let i=0;i<total;i++)if(localStorage.getItem('EQ_'+curEq+'_'+i)=='1')done++;document.getElementById('prog').innerText=`${curEq}: ${done}/${total} - ${Math.round(done/total*100)}%`;genQR();}
function cam(k){let inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.capture='environment';inp.onchange=e=>{let r=new FileReader();r.onload=()=>{localStorage.setItem(k+'_img',r.result);render();};r.readAsDataURL(e.target.files[0]);};inp.click();}
let canvas,ctx,drawing=false;function setupSig(){canvas=document.getElementById('sig');ctx=canvas.getContext('2d');canvas.width=canvas.offsetWidth;canvas.height=110;let d=localStorage.getItem('SIG_'+curEq);if(d){let im=new Image();im.onload=()=>ctx.drawImage(im,0,0);im.src=d;}canvas.addEventListener('touchstart',e=>{drawing=true;ctx.beginPath();ctx.moveTo(e.touches[0].clientX-canvas.getBoundingClientRect().left,e.touches[0].clientY-canvas.getBoundingClientRect().top);e.preventDefault();});canvas.addEventListener('touchmove',e=>{if(!drawing)return;ctx.lineTo(e.touches[0].clientX-canvas.getBoundingClientRect().left,e.touches[0].clientY-canvas.getBoundingClientRect().top);ctx.stroke();e.preventDefault();});canvas.addEventListener('touchend',()=>{drawing=false;localStorage.setItem('SIG_'+curEq,canvas.toDataURL());});canvas.addEventListener('mousedown',e=>{drawing=true;ctx.beginPath();ctx.moveTo(e.offsetX,e.offsetY);});canvas.addEventListener('mousemove',e=>{if(!drawing)return;ctx.lineTo(e.offsetX,e.offsetY);ctx.stroke();});canvas.addEventListener('mouseup',()=>{drawing=false;localStorage.setItem('SIG_'+curEq,canvas.toDataURL());});}function clearSig(){ctx.clearRect(0,0,canvas.width,canvas.height);localStorage.removeItem('SIG_'+curEq);}
function genQR(){let comp=localStorage.getItem('COMP')||'SBG';let txt=`V9 FULL HSE OWNED BY Adel | ${comp} | ${curEq} | ${Date.now()}`;document.getElementById('qrtext').innerText=txt;document.getElementById('qrcode').innerHTML='';new QRCode(document.getElementById('qrcode'),{text:txt,width:110,height:110});}
async function exportPDF(){const {jsPDF}=window.jspdf;const doc=new jsPDF();let comp=localStorage.getItem('COMP')||'SBG';let proj=localStorage.getItem('PROJ')||'Rakaez';let area=localStorage.getItem('AREA')||'';let data=DB[curEq];doc.setFontSize(13);doc.text(`${data.t} - ${comp}`,10,12);doc.setFontSize(9);doc.text(`Project: ${proj} | Area: ${area} | Date: ${new Date().toISOString().split('T')[0]} | OWNER: Adel Mahmoud V9 FULL`,10,18);let y=26;for(let i=0;i<data.ar.length;i++){let s=localStorage.getItem('EQ_'+curEq+'_'+i)=='1'?'PASS':'FAIL';doc.setFontSize(8);doc.text(`${i+1}. ${data.en[i]}: ${s}`,10,y);let img=localStorage.getItem('EQ_'+curEq+'_'+i+'_img');if(img){try{doc.addImage(img,'JPEG',120,y,22,14);y+=16;}catch(e){y+=5;}}else y+=5;if(y>272){doc.addPage();y=10;}}let sig=localStorage.getItem('SIG_'+curEq);if(sig){try{doc.addImage(sig,'PNG',10,y,50,12);}catch(e){}}y+=15;doc.setFontSize(7);doc.text(`V9 FULL HSE COMMERCIAL | ${comp} | ${curEq} | © Adel Mahmoud 2026 | QR Verified`,10,y);doc.save(`${comp}_${curEq}_${Date.now()}.pdf`);}
setupSig();upd();switchEq(curEq);
