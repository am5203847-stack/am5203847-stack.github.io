<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adel V9.1 PDF PRO</title><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>body{background:#000;color:#fff;font-family:system-ui;padding:6px}.card{border:2px solid #d4af37;border-radius:14px;padding:10px;margin:8px 0;background:#111}.gold{background:linear-gradient(#d4af37,#ffd700);color:#000;width:100%;padding:12px;border-radius:12px;border:none;font-weight:bold;margin:4px 0}input,select{width:95%;padding:10px;margin:4px 0;border-radius:8px;border:1px solid #d4af37;background:#222;color:#fff}.item{background:#1a1a1a;padding:8px;margin:5px 0;border-radius:10px;border-right:4px solid #d4af37;display:flex;justify-content:space-between;align-items:center}.topBar{display:flex;gap:4px;flex-wrap:wrap}.topBar button{flex:1 1 30%;padding:10px;border-radius:10px;border:1px solid #d4af37;background:#222;color:#ffd700;font-weight:bold}.topBar button.active{background:#ffd700;color:#000}#sig{border:2px dashed #00ff88;width:100%;height:110px;background:#fff;border-radius:8px}#qrcode{width:110px;height:110px;margin:8px auto;background:#fff;padding:4px}</style></head>
<body>
<div class="card" style="text-align:center;border-color:#00ff88"><h2 style="color:#00ff88;margin:2px">✅ ADEL V9.1 PDF PRO</h2><p style="color:#ffd700;margin:2px">منصة السلامة الشاملة - تصدير احترافي</p><p id="compD" style="color:#fff;font-size:13px"></p><div style="display:grid;grid-template-columns:1fr 1fr;gap:4px"><input id="c1" placeholder="اسم الشركة"><input id="c2" placeholder="المشروع"><input id="c3" placeholder="المساحة m2"><input id="c4" placeholder="المنطقة"></div><button class="gold" style="padding:8px" onclick="saveC()">💾 حفظ بيانات الشركة</button><p id="prog" style="color:#ffd700"></p></div>

<div class="card"><p style="color:#ffd700;text-align:center">اختر نوع الفحص:</p><div class="topBar">
<button id="btn_forklift" class="active" onclick="switchEq('forklift')">🚜 فوركلفت 29</button>
<button id="btn_crane" onclick="switchEq('crane')">🏗️ كرين 25</button>
<button id="btn_scaffold" onclick="switchEq('scaffold')">🧱 سقالات 30</button>
<button id="btn_elec" onclick="switchEq('elec')">⚡ كهرباء 20</button>
<button id="btn_ptw" onclick="switchEq('ptw')">🔥 PTW</button>
<button id="btn_ppe" onclick="switchEq('ppe')">🪖 PPE</button>
</div></div>

<div class="card"><h3 id="eqTitle" style="color:#ffd700;text-align:center"></h3><div id="list"></div><div class="card"><p style="color:#00ff88">✍️ توقيع الفاحص:</p><canvas id="sig"></canvas><button onclick="clearSig()" style="background:#555;color:#fff;padding:5px 10px;border-radius:6px;border:none">مسح التوقيع</button></div><div style="text-align:center"><div id="qrcode"></div><p id="qrtext" style="font-size:8px;color:#aaa"></p></div>
<button class="gold" onclick="exportPDF()">📄 تصدير PDF PRO ذهبي</button>
</div>
<div class="card" style="text-align:center;font-size:10px;color:#888">OWNED BY ADEL MAHMOUD • V9.1 PDF PRO • © 2026 COMMERCIAL</div>

<script>
const DB={
forklift:{t:'فحص الرافعة الشوكية - 29 بند', en:["Engine Oil","Radiator Water","Hydraulic Oil","Brake Oil","Tires Condition","Forks & Chains","Brake System","Horn & Lights","Seat Belt","Mirrors","Oil Leaks Check","Battery","Fire Extinguisher","Warning Triangle","Control Panel","Steering","OHG Roof Guard","Chassis","Control Buttons","Mattress/Seat","Reverse Buzzer","Rotating Beacon Light","General Cleanliness","Operation Permit","Driver License","No Smoking Sign","Safe Work Area","Load Within Limit","Safety Signature"]},
crane:{t:'فحص الكرين - 25 بند', en:["Crane Operation License Valid","Load Chart Available & Readable","Wire Ropes No Damage","Hook with Safety Latch","Main & Aux Brakes","LMI Load Indicator Working","Hoist Limit Switch","Outriggers Condition","Tires & Pressure","Hydraulic No Leaks","Lights & Horn","Fire Extinguisher","Operator Seat Belt","Work Area Barricaded","Lifting Plan Available","Wind Speed Within Limit","Grounding OK","Rigger & Signalman Qualified","Radio Communication","Chains & Shackles","No Standing Under Load","Safe Distance from Power Lines","Cabin Clean","Daily Maintenance Log","Safety Officer Signature"]},
scaffold:{t:'فحص السقالات - 30 بند', en:["Green Scaffold Tag Valid","Designed by Engineer","Level & Stable Ground","Base Plates Installed","Cross & Longitudinal Bracing","Ladders Fixed & Safe","Full Planks No Gaps","Handrail + Midrail","Toe Board Installed","Tied to Building Every 4m","Load Within Limit","No Falling Materials","Harness & Fall Protection","Tubes & Clamps No Rust","No Nearby Power Lines","Adequate Lighting","Safe Access","Warning Signs","Emergency Exits","Platform Clean","No Unauthorized Modification","Daily Inspection by Inspector","Inspection Log Book","Workers Trained","Full PPE","Weather Suitable","Mobile vs Fixed Correct","Mobile Wheel Locks","Proper Height","Scaffold Inspector Signature"]},
elec:{t:'فحص الكهرباء - 20 بند', en:["Electrical Panel Locked","ELCB/GFCI Working","Earthing System OK","No Exposed/Damaged Wires","Connections in Closed Boxes","High Voltage Warning Signs","CO2 Extinguisher Available","No Overload on Sockets","Equipment Insulated","Electrical PPE Gloves & Glasses","Electrical Work Permit","LOTO Applied","Emergency Light Working","Safe Distance from Water","Periodic Maintenance Logged","Licensed Electrician","Emergency Exits Clear","Insulated Ladder for Height","Portable Tools Inspected","Electrical Responsible Signature"]},
ptw:{t:'نظام تصاريح العمل PTW', en:["PTW Type Hot/Cold/Height/Excavation","Detailed Work Description","Location & Area","Permit Duration From-To","Risks Identified & Risk Assessment","JSA/Method Statement Attached","Energy Isolation LOTO","Gas Test Done","Ventilation Provided","Fire Watch Assigned","Fire Extinguishing Means","Confined Space Entry Permit","Harness & Anchor Point","Excavation Permit & Utilities Map","Area Barricaded","Emergency Communication","Workers Names & Signatures","Supervisor Responsible","Safety Signature","Project Manager Signature","PTW Closure After Work"]},
ppe:{t:'فحص مهمات الوقاية PPE', en:["Safety Helmet","Safety Glasses","Suitable Work Gloves","Safety Shoes Steel Toe","High Visibility Vest","Full Body Harness for Height","Hearing Protection Ear Plugs","Respiratory Mask as Needed","Suitable Work Clothes","Face Shield for Welding/Cutting","Tools Belt","Head Lamp for Night Work","Number of Workers Checked","Compliance Percentage","Morning TBT Done","Safety Officer Signature"]}
};
let curEq=localStorage.getItem('CUR_EQ')||'forklift';
function saveC(){localStorage.setItem('COMP',document.getElementById('c1').value);localStorage.setItem('PROJ',document.getElementById('c2').value);localStorage.setItem('AREA',document.getElementById('c3').value);localStorage.setItem('ZONE',document.getElementById('c4').value);upd();alert('تم حفظ الشركة');}
function upd(){let c=localStorage.getItem('COMP')||'شركة النخبة';let p=localStorage.getItem('PROJ')||'Rakaez A-4';document.getElementById('compD').innerText=c+' | '+p;document.getElementById('c1').value=localStorage.getItem('COMP')||'';document.getElementById('c2').value=localStorage.getItem('PROJ')||'';document.getElementById('c3').value=localStorage.getItem('AREA')||'';document.getElementById('c4').value=localStorage.getItem('ZONE')||'';render();}
function switchEq(eq){curEq=eq;localStorage.setItem('CUR_EQ',eq);document.querySelectorAll('.topBar button').forEach(b=>b.classList.remove('active'));document.getElementById('btn_'+eq).classList.add('active');let d=localStorage.getItem('SIG_'+eq);if(d){let im=new Image();im.onload=()=>{ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(im,0,0);};im.src=d;}else clearSig();render();}
function render(){let data=DB[curEq];document.getElementById('eqTitle').innerText=data.t;let d=document.getElementById('list');d.innerHTML='';data.en.forEach((txt,i)=>{let k='EQ_'+curEq+'_'+i;let chk=localStorage.getItem(k)=='1';let img=localStorage.getItem(k+'_img');d.innerHTML+=`<div class="item" style="${chk?'border-right-color:#00ff88;background:#0a1f0a':''}"><span>${i+1}- ${DB[curEq].t.split(' ')[0]} : ${txt}</span><div style="display:flex;align-items:center;gap:4px"><input type="checkbox" ${chk?'checked':''} onchange="localStorage.setItem('${k}',this.checked?1:0);upd()" style="width:22px;height:22px"><button onclick="cam('${k}')" style="background:#222;color:#ffd700;border:1px solid #ffd700;padding:4px 8px;border-radius:6px">📸</button></div>${img?`<br><img src="${img}" style="width:50px;height:50px;border-radius:6px;border:1px solid #d4af37;margin-top:4px">`:''}</div>`;});let total=data.en.length;let done=0;for(let i=0;i<total;i++)if(localStorage.getItem('EQ_'+curEq+'_'+i)=='1')done++;document.getElementById('prog').innerText=`${curEq.toUpperCase()}: ${done}/${total} - ${Math.round(done/total*100)}% | ${done==total?'✅ جاهز للتصدير':'⚠️ كمل الفحص'}`;genQR();}
function cam(k){let inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.capture='environment';inp.onchange=e=>{let r=new FileReader();r.onload=()=>{localStorage.setItem(k+'_img',r.result);render();};r.readAsDataURL(e.target.files[0]);};inp.click();}
let canvas,ctx,drawing=false;function setupSig(){canvas=document.getElementById('sig');ctx=canvas.getContext('2d');canvas.width=canvas.offsetWidth;canvas.height=110;ctx.lineWidth=2;ctx.strokeStyle='#000';let d=localStorage.getItem('SIG_'+curEq);if(d){let im=new Image();im.onload=()=>ctx.drawImage(im,0,0);im.src=d;}canvas.addEventListener('touchstart',e=>{drawing=true;ctx.beginPath();ctx.moveTo(e.touches[0].clientX-canvas.getBoundingClientRect().left,e.touches[0].clientY-canvas.getBoundingClientRect().top);e.preventDefault();});canvas.addEventListener('touchmove',e=>{if(!drawing)return;ctx.lineTo(e.touches[0].clientX-canvas.getBoundingClientRect().left,e.touches[0].clientY-canvas.getBoundingClientRect().top);ctx.stroke();e.preventDefault();});canvas.addEventListener('touchend',()=>{drawing=false;localStorage.setItem('SIG_'+curEq,canvas.toDataURL());});canvas.addEventListener('mousedown',e=>{drawing=true;ctx.beginPath();ctx.moveTo(e.offsetX,e.offsetY);});canvas.addEventListener('mousemove',e=>{if(!drawing)return;ctx.lineTo(e.offsetX,e.offsetY);ctx.stroke();});canvas.addEventListener('mouseup',()=>{drawing=false;localStorage.setItem('SIG_'+curEq,canvas.toDataURL());});}function clearSig(){ctx.clearRect(0,0,canvas.width,canvas.height);localStorage.removeItem('SIG_'+curEq);}
function genQR(){let comp=localStorage.getItem('COMP')||'SBG';let txt=`ADEL V9.1 PRO | ${comp} | ${curEq} | ${new Date().toISOString().split('T')[0]} | OWNER:Adel Mahmoud | ${Date.now()}`;document.getElementById('qrtext').innerText=txt;document.getElementById('qrcode').innerHTML='';new QRCode(document.getElementById('qrcode'),{text:txt,width:110,height:110});}
async function exportPDF(){const {jsPDF}=window.jspdf;const doc=new jsPDF();let comp=localStorage.getItem('COMP')||'ELITE COMPANY';let proj=localStorage.getItem('PROJ')||'Rakaez A-4';let area=localStorage.getItem('AREA')||'';let zone=localStorage.getItem('ZONE')||'';let data=DB[curEq];let dateStr=new Date().toISOString().split('T')[0];
// HEADER GOLD
doc.setFillColor(0,0,0);doc.rect(0,0,210,22,'F');doc.setTextColor(255,215,0);doc.setFontSize(16);doc.setFont('helvetica','bold');doc.text(`ADEL V9.1 FULL HSE - ${curEq.toUpperCase()} REPORT`,10,13);
doc.setFontSize(9);doc.setTextColor(255,255,255);doc.text(`Company: ${comp} | Project: ${proj} | Area: ${area} m2 | Zone: ${zone}`,10,18);
doc.setTextColor(0,255,136);doc.setFontSize(8);doc.text(`Date: ${dateStr} | OWNER: Adel Mahmoud | QR Verified | Commercial`,10,21);
let y=28;let passCount=0;
for(let i=0;i<data.en.length;i++){let isPass=localStorage.getItem('EQ_'+curEq+'_'+i)=='1';if(isPass)passCount++;let status=isPass?'PASS':'FAIL';if(y>268){doc.addPage();y=10;}doc.setFontSize(9);doc.setFont('helvetica','normal');if(isPass){doc.setTextColor(0,128,0);}else{doc.setTextColor(200,0,0);}doc.text(`${i+1}. ${data.en[i]} : ${status}`,10,y);let img=localStorage.getItem('EQ_'+curEq+'_'+i+'_img');if(img){try{doc.addImage(img,'JPEG',155,y-4,22,14);y+=16;}catch(e){y+=6;}}else y+=6;}
if(y>240){doc.addPage();y=10;}
y+=4;doc.setTextColor(0,0,0);doc.setFontSize(10);doc.setFont('helvetica','bold');doc.text(`Result: ${passCount}/${data.en.length} - ${Math.round(passCount/data.en.length*100)}% - ${passCount==data.en.length?'APPROVED':'NEEDS ACTION'}`,10,y);y+=8;
let sig=localStorage.getItem('SIG_'+curEq);if(sig){try{doc.setFontSize(8);doc.text('Inspector Signature:',10,y);doc.addImage(sig,'PNG',40,y-6,50,14);}catch(e){}}y+=18;
doc.setFillColor(212,175,55);doc.rect(0,y,210,10,'F');doc.setTextColor(0,0,0);doc.setFontSize(7);doc.text(`V9.1 PDF PRO COMMERCIAL | ${comp} | ${curEq} | ${dateStr} | © Adel Mahmoud 2026 | All Rights Reserved | QR:${Date.now()}`,5,y+6);
doc.save(`${comp}_${curEq}_V9.1_PRO_${dateStr}.pdf`);}
setupSig();upd();switchEq(curEq);
</script></body></html>
