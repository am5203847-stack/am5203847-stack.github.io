<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adel V8.2</title><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>body{background:#000;color:#fff;font-family:system-ui;padding:8px}.card{border:2px solid #d4af37;border-radius:14px;padding:12px;margin:10px 0;background:#111}.gold{background:#ffd700;color:#000;width:100%;padding:14px;border-radius:12px;border:none;font-weight:bold}input{width:95%;padding:10px;margin:6px 0;border-radius:8px;border:1px solid #d4af37;background:#222;color:#fff}.item{background:#1a1a1a;padding:10px;margin:6px 0;border-radius:10px;border-right:4px solid #d4af37}#qrcode{width:128px;height:128px;margin:10px auto;background:#fff;padding:5px}#sig{border:2px dashed #00ff88;width:100%;height:120px;background:#fff}</style></head>
<body>
<div class="card" style="text-align:center;border-color:#00ff88"><h2 style="color:#00ff88">✅ ADEL V8.2 شغال!</h2><p style="color:#ffd700">COMMERCIAL - بدون باسورد</p><p id="cd" style="color:#fff"></p><input id="c1" placeholder="اسم الشركة - مثال: ارامكو"><input id="c2" placeholder="المشروع - مثال: نيوم"><button class="gold" style="padding:8px" onclick="saveC()">💾 حفظ</button><p id="prog" style="color:#ffd700"></p></div>
<div class="card"><div id="list"></div><canvas id="sig"></canvas><div style="text-align:center"><div id="qrcode"></div></div><button class="gold" onclick="exportPDF()">📄 تصدير PDF باسم الشركة</button><button style="background:#333;color:#fff;width:100%;padding:8px;border-radius:8px;border:none;margin-top:6px" onclick="localStorage.clear();location.reload()">مسح كل شي</button></div>
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(r=>{r.forEach(x=>x.unregister())});}
const AR=["زيت المحرك","مياه الرادياتير","زيت الهيدروليك","زيت الفرامل","الاطارات","الشوكات","الفرامل","الكلاكس","حزام الامان","المرايات","تسريب زيوت","البطارية","طفاية الحريق","مثلث تحذير","لوحة التحكم","الدركسيون","السقف OHG","الشاسية","ازرار التحكم","الفرشة","بوق الرجوع","الاضاءة الدوارة","النظافة","تصريح التشغيل","رخصة السائق","ممنوع التدخين","منطقة العمل","الحمولة","توقيع السلامة"];
const EN=["Engine Oil","Radiator Water","Hydraulic Oil","Brake Oil","Tires","Forks & Chains","Brakes","Horn & Lights","Seat Belt","Glass & Mirrors","Oil Leaks","Battery","Fire Extinguisher","Warning Triangle","Control Panel","Steering","OHG Roof","Chassis","Control Buttons","Mattress","Reverse Buzzer","Rotating Light","General Cleanliness","Operation Permit","Driver License","No Smoking Zone","Work Area","Load","Safety Signature"];
function saveC(){localStorage.setItem('COMP',document.getElementById('c1').value);localStorage.setItem('PROJ',document.getElementById('c2').value);upd();alert('اتحفظ!');}
function upd(){let c=localStorage.getItem('COMP')||'SBG';let p=localStorage.getItem('PROJ')||'Rakaez A-4';document.getElementById('cd').innerText=c+' | '+p;document.getElementById('c1').value=localStorage.getItem('COMP')||'';document.getElementById('c2').value=localStorage.getItem('PROJ')||'';let cc=0;for(let i=0;i<29;i++)if(localStorage.getItem('D'+i)=='1')cc++;document.getElementById('prog').innerText=cc+'/29 - '+Math.round(cc/29*100)+'%';genQR();}
function render(){let d=document.getElementById('list');d.innerHTML='';AR.forEach((t,i)=>{let k='D'+i;let chk=localStorage.getItem(k)=='1';let img=localStorage.getItem(k+'_img');d.innerHTML+=`<div class="item"><span>${i+1}-${t}</span><input type="checkbox" ${chk?'checked':''} onchange="localStorage.setItem('${k}',this.checked?1:0);upd()" style="width:22px"><button onclick="cam('${k}')" style="background:#222;color:#ffd700;border:1px solid #ffd700;padding:4px 8px;border-radius:6px">📸</button>${img?`<br><img src="${img}" style="width:50px;height:50px">`:''}</div>`;});}
function cam(k){let i=document.createElement('input');i.type='file';i.accept='image/*';i.capture='environment';i.onchange=e=>{let r=new FileReader();r.onload=()=>{localStorage.setItem(k+'_img',r.result);render();};r.readAsDataURL(e.target.files[0]);};i.click();}
let cv,ct,dr=false;function setupSig(){cv=document.getElementById('sig');ct=cv.getContext('2d');cv.width=cv.offsetWidth;cv.height=120;let d=localStorage.getItem('SIG');if(d){let im=new Image();im.onload=()=>ct.drawImage(im,0,0);im.src=d;}cv.addEventListener('touchstart',e=>{dr=true;ct.beginPath();ct.moveTo(e.touches[0].clientX-cv.getBoundingClientRect().left,e.touches[0].clientY-cv.getBoundingClientRect().top);e.preventDefault();});cv.addEventListener('touchmove',e=>{if(!dr)return;ct.lineTo(e.touches[0].clientX-cv.getBoundingClientRect().left,e.touches[0].clientY-cv.getBoundingClientRect().top);ct.stroke();e.preventDefault();});cv.addEventListener('touchend',()=>{dr=false;localStorage.setItem('SIG',cv.toDataURL());});}
function genQR(){let txt=`V8.2 OWNED BY Adel Mahmoud | ${localStorage.getItem('COMP')||'SBG'} | ${Date.now()}`;document.getElementById('qrcode').innerHTML='';new QRCode(document.getElementById('qrcode'),{text:txt,width:128,height:128});}
async function exportPDF(){const {jsPDF}=window.jspdf;const doc=new jsPDF();let comp=localStorage.getItem('COMP')||'SBG';let proj=localStorage.getItem('PROJ')||'Rakaez';doc.text(`COMMERCIAL REPORT - ${comp}`,10,12);doc.setFontSize(10);doc.text(`Project: ${proj} | OWNER: Adel Mahmoud | © 2026`,10,18);let y=26;for(let i=0;i<29;i++){doc.text(`${i+1}. ${EN[i]}: ${localStorage.getItem('D'+i)=='1'?'PASS':'FAIL'}`,10,y);let img=localStorage.getItem('D'+i+'_img');if(img){try{doc.addImage(img,'JPEG',120,y,25,15);y+=17;}catch(e){y+=6;}}else y+=6;if(y>270){doc.addPage();y=10;}}doc.save(`${comp}-${Date.now()}.pdf`);}
upd();render();setupSig();
</script></body></html>
