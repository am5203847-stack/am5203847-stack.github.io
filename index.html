
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>متجري | أفضل المنتجات</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',system-ui}
body{background:#0f0f0f;color:#fff}
header{padding:20px;background:#1a1a1a;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:24px;font-weight:bold;color:#f5c518}
nav a{color:#fff;text-decoration:none;margin:0 10px}
.hero{text-align:center;padding:80px 20px;background:linear-gradient(135deg,#1a1a1a,#2a2a2a)}
.hero h1{font-size:42px;margin-bottom:15px}
.hero p{color:#aaa;margin-bottom:25px}
.btn{padding:12px 30px;background:#f5c518;color:#000;border:none;border-radius:8px;font-weight:bold;cursor:pointer;text-decoration:none;display:inline-block}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;padding:40px 20px;max-width:1100px;margin:auto}
.card{background:#1e1e1e;border-radius:12px;padding:15px;text-align:center}
.card img{width:100%;border-radius:8px;height:200px;object-fit:cover;background:#333}
.card h3{margin:12px 0 5px}
.card .price{color:#f5c518;font-weight:bold;font-size:18px;margin-bottom:10px}
footer{text-align:center;padding:30px;background:#1a1a1a;color:#777;margin-top:30px}
</style>
</head>
<body>
<header>
<div class="logo">AM STORE 👑</div>
<nav>
<a href="#">الرئيسية</a>
<a href="#">المنتجات</a>
<a href="#">تواصل معنا</a>
</nav>
</header>

<div class="hero">
<h1>أهلا بيك في متجرنا الملكي 👑</h1>
<p>أفضل المنتجات بأفضل الأسعار - شحن مجاني داخل مصر</p>
<a href="#products" class="btn">تسوق الآن</a>
</div>

<div class="products" id="products">
<div class="card">
<img src="https://picsum.photos/300/200?1" alt="">
<h3>منتج مميز 1</h3>
<div class="price">299 جنيه</div>
<a href="#" class="btn">اطلب الآن</a>
</div>
<div class="card">
<img src="https://picsum.photos/300/200?2" alt="">
<h3>منتج مميز 2</h3>
<div class="price">459 جنيه</div>
<a href="#" class="btn">اطلب الآن</a>
</div>
<div class="card">
<img src="https://picsum.photos/300/200?3" alt="">
<h3>منتج مميز 3</h3>
<div class="price">199 جنيه</div>
<a href="#" class="btn">اطلب الآن</a>
</div>
</div>

<footer>
© 2026 AM STORE - جميع الحقوق محفوظة
</footer>
</body>
</html>
