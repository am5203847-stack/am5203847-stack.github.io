<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adel Mahmoud V7 - Photos in PDF</title><link rel="manifest" href="manifest.json"><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>body{background:#000;color:#fff;font-family:system-ui;padding:8px}.card{border:2px solid #d4af37;border-radius:14px;padding:12px;margin:10px 0;background:#111}.owner{border:2px solid #00ff88;background:linear-gradient(#111,#002a14);text-align:center}.tab{padding:10px 18px;margin:3px;border-radius:20px;border:1px solid #d4af37;display:inline-block}.tab.active{background:#d4af37;color:#000}.item{background:#1a1a1a;padding:10px;margin:6px 0;border-radius:10px;border-right:4px solid #d4af37;display:flex;justify-content:space-between;align-items:center}.item.ok{border-right-color:#00ff88}.gold{background:linear-gradient(#d4af37,#ffd700);color:#000;width:100%;padding:14px;border-radius:12px;border:none;font-weight:bold;margin:6px 0}.thumb{width:50px;height:50px;border-radius:6px;border:1px solid #d4af37}#sig{border:2px dashed #00ff88;width:100%;height:150px;border-radius:10px;background:#fff;touch-action:none}#qrcode{width:128px;height:128px;margin:10px auto;background:#fff;padding:5px}</style></head>
<body>
<div class="card owner"><h2 style="color:#00ff88;margin:0">👑 ADEL MAHMOUD V7</h2><h3 style="color:#ffd700;margin:4px">📸 PHOTOS IN PDF</h3><p style="margin:2px">Rakaez A-4 415.8m2 | عيون 44 عمود</p><p style="color:#aaa;font-size:11px">OWNED BY Adel Mahmoud © 2026 | ID: SBG2026adel89</p><span class="tab active" id="tD" onclick="show('daily')">يومي 29</span><span class="tab" id="tW" onclick="show('weekly')">اسبوعي 50H</span><p id="prog" style="color:#ffd700"></p></div>
<div class="card"><div id="dailyList"></div><div id="weeklyList" style="display:none"></div>
<div class="card"><p style="color:#00ff88">✍️ توقيع Adel Mahmoud:</p><canvas id="sig"></canvas><button onclick="clearSig()" style="background:#555;color:#fff;padding:6px 12px;border-radius:8px;border:none;margin-top:5px">مسح</button></div>
<div class="card" style="text-align:center"><div id="qrcode"></div><p id="qrtext" style="font-size:10px;color:#aaa"></p></div>
<button class="gold" onclick="exportPDF()">📄 V7 تصدير PDF بالصور + توقيع</button><button style="background:#d00000;color:#fff;width:100%;padding:10px;border-radius:10px;border:none;margin-top:6px" onclick="localStorage.clear();location.reload()">مسح الكل</button></div>
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}
const AR=["زيت المحرك","مياه الرادياتير","زيت الهيدروليك","زيت الفرامل","الاطارات","الشوكات","الفرامل","الكلاكس","حزام الامان","المرايات","تسريب زيوت","البطارية","طفاية الحريق","مثلث تحذير","لوحة التحكم","الدركسيون","السقف OHG","الشاسية","ازرار التحكم","الفرشة","بوق الرجوع","الاضاءة الدوارة","النظافة","تصريح التشغيل","رخصة السائق","ممنوع التدخين","منطقة العمل","الحمولة","توقيع السلامة"];
const EN=["Engine Oil","Radiator Water","Hydraulic Oil","Brake Oil","Tires","Forks & Chains","Brakes","Horn & Lights","Seat Belt","Glass & Mirrors","Oil Leaks","Battery","Fire Extinguisher","Warning Triangle","Control Panel","Steering","OHG Roof","Chassis","Control Buttons","Mattress","Reverse Buzzer","Rotating Light","General Cleanliness","Operation Permit","Driver License","No Smoking Zone","Work Area","Load","Safety Signature"];
const WAR=["زيت المحرك","فلتر الزيت","فلتر الهواء","فلتر هيدروليك","تشحيم 50 نقطة","شد السيور","بطارية","كهرباء","سلاسل","خراطيم هيدروليك","اسطوانات رفع","فرامل"];const WEN=["Oil Change","Oil Filter","Air Filter","Hydraulic Filter","Greasing 50pts","Belts","Battery Check","Electric","Chains","Hoses","Cylinders","Brakes"];
let cur='daily';function show(t){cur=t;document.getElementById('dailyList').style.display=t=='daily'?'block':'none';document.getElementById('weeklyList').style.display=t=='weekly'?'block':'none';document.getElementById('tD').className=t=='daily'?'tab active':'tab';document.getElementById('tW').className=t=='weekly'?'tab active':'tab';upd();}
function render(A,p,div){let d=document.getElementById(div);d.innerHTML='';A.forEach((txt,i)=>{let k=p+i;let chk=localStorage.getItem(k)=='1';let img=localStorage.getItem(k+'_img');d.innerHTML+=`<div class="item ${chk?'ok':''}"><span>${i+1}- ${txt}</span><div><input type="checkbox" ${chk?'checked':''} onchange="localStorage.setItem('${k}',this.checked?1:0);location.reload()" style="width:24px;height:24px"><button style="background:#222;color:#ffd700;border:1px solid #ffd700;padding:6px 10px;border-radius:8px;margin-right:4px" onclick="openCam('${k}')">📸</button></div>${img?`<br><img src="${img}" class="thumb">`:''}</div>`;});}
function openCam(k){let inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.capture='environment';inp.onchange=e=>{let r=new FileReader();r.onload=()=>{localStorage.setItem(k+'_img',r.result);location.reload();};r.readAsDataURL(e.target.files[0]);};inp.click();}
function upd(){let total=cur=='daily'?29:WAR.length;let pre=cur=='daily'?'D':'W';let c=0;for(let i=0;i<total;i++)if(localStorage.getItem(pre+i)=='1')c++;document.getElementById('prog').innerText=`${cur}: ${c}/${total} - ${Math.round(c/total*100)}%`;genQR();}
const canvas=document.getElementById('sig');const ctx=canvas.getContext('2d');let drawing=false;function resize(){canvas.width=canvas.offsetWidth;canvas.height=150;let d=localStorage.getItem('SIG');if(d){let img=new Image();img.onload=()=>ctx.drawImage(img,0,0);img.src=d;}}setTimeout(resize,300);canvas.addEventListener('touchstart',e=>{drawing=true;ctx.beginPath();ctx.moveTo(e.touches[0].clientX-canvas.getBoundingClientRect().left,e.touches[0].clientY-canvas.getBoundingClientRect().top);e.preventDefault();});canvas.addEventListener('touchmove',e=>{if(!drawing)return;ctx.lineTo(e.touches[0].clientX-canvas.getBoundingClientRect().left,e.touches[0].clientY-canvas.getBoundingClientRect().top);ctx.stroke();e.preventDefault();});canvas.addEventListener('touchend',()=>{drawing=false;localStorage.setItem('SIG',canvas.toDataURL());});canvas.addEventListener('mousedown',e=>{drawing=true;ctx.beginPath();ctx.moveTo(e.offsetX,e.offsetY);});canvas.addEventListener('mousemove',e=>{if(!drawing)return;ctx.lineTo(e.offsetX,e.offsetY);ctx.stroke();});canvas.addEventListener('mouseup',()=>{drawing=false;localStorage.setItem('SIG',canvas.toDataURL());});function clearSig(){ctx.clearRect(0,0,canvas.width,canvas.height);localStorage.removeItem('SIG');}
function genQR(){let now=new Date();let c=0;for(let i=0;i<29;i++)if(localStorage.getItem('D'+i)=='1')c++;let txt=`V7 OWNED BY Adel Mahmoud | SBG-RakaezA4-Photos | ${now.toISOString().split('T')[0]} | ${c}/29 | ${Date.now()}`;document.getElementById('qrtext').innerText=txt;document.getElementById('qrcode').innerHTML='';new QRCode(document.getElementById('qrcode'),{text:txt,width:128,height:128});}
render(AR,'D','dailyList');render(WAR,'W','weeklyList');upd();
async function exportPDF(){const {jsPDF}=window.jspdf;const doc=new jsPDF();let now=new Date();let ds=now.toISOString().split('T')[0]+' '+now.toLocaleTimeString();doc.setFontSize(15);doc.text('OWNED BY ADEL MAHMOUD - V7 PHOTOS IN PDF',10,12);doc.setFontSize(10);doc.text(`Date: ${ds} | OWNER: Adel Mahmoud | ID: SBG2026adel89 | V7 | © 2026`,10,18);doc.text(`Project: Rakaez A-4 415.8m2 | 44 Columns | 22 Floors | OFFLINE APP`,10,24);let y=32;doc.text('DAILY 29 Points with Photos:',10,y);y+=6;for(let i=0;i<29;i++){let s=localStorage.getItem('D'+i)=='1'?'PASS':'FAIL';doc.setFontSize(9);doc.text(`${i+1}. ${EN[i]} : ${s}`,10,y);let img=localStorage.getItem('D'+i+'_img');if(img){try{y+=2;doc.addImage(img,'JPEG',120,y,30,20);y+=22;}catch(e){y+=5;}}else{y+=5;}if(y>260){doc.addPage();y=10;}}y+=4;doc.text('WEEKLY 50H:',10,y);y+=6;for(let i=0;i<WEN.length;i++){let s=localStorage.getItem('W'+i)=='1'?'PASS':'FAIL';doc.text(`${i+1}. ${WEN[i]} : ${s}`,10,y);let img=localStorage.getItem('W'+i+'_img');if(img){try{doc.addImage(img,'JPEG',120,y,30,20);y+=22;}catch(e){y+=5;}}else{y+=5;}if(y>260){doc.addPage();y=10;}}y+=8;doc.text('Signature:',10,y);let sig=localStorage.getItem('SIG');if(sig){try{doc.addImage(sig,'PNG',40,y+2,60,20);}catch(e){}}y+=25;doc.setFontSize(8);doc.text('QR Verified | V7 PHOTOS IN PDF | OWNED BY Adel Mahmoud | First HSE Mobile in Egypt | SBG GOLD | © Adel Mahmoud',10,y);doc.save(`Adel-Mahmoud-V7-PHOTOS-${Date.now()}.pdf`);}
</script></body></html>
